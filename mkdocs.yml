site_name: GPokeT2
site_description: A GPT-2 based autoregressive model that generates 64×64 Pokémon sprites token by token.
site_author: ThinBaker
site_url: https://delgadopanadero.github.io/GPokeT2/
repo_url: https://github.com/DelgadoPanadero/GPokeT2
repo_name: DelgadoPanadero/GPokeT2

docs_dir: docs

nav:
  - Pokédex: index.md
  - Usage: usage.md
  - Model Details: model.md
  - Analysis: analysis.md
  - About: about.md
  - Contributing: contributing.md

theme:
  name: material
  logo: gpoket2.png
  favicon: gpoket2.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
